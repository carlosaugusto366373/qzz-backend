<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>QZZ • Admin</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #0a0a0a;
    --panel: #111;
    --panel-2: #161616;
    --line: #222;
    --line-2: #2a2a2a;
    --txt: #d4d4d4;
    --txt-2: #888;
    --txt-3: #555;
    --red: #d93025;
    --red-2: #b02418;
    --green: #26a65b;
    --yellow: #c9a227;
    --blue: #3a7bd5;
  }

  html, body {
    background: var(--bg);
    color: var(--txt);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  body {
    padding: 20px;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  .header {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .brand .dot {
    width: 8px; height: 8px;
    background: var(--red);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--red);
    animation: blink 1.6s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .brand h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
  }

  .brand h1 span { color: var(--txt-3); font-weight: 400; }

  .header .meta { color: var(--txt-3); font-size: 11px; }
  .header .meta b { color: var(--txt-2); font-weight: 500; }

  .err {
    background: #1a0808;
    border-left: 3px solid var(--red);
    color: #ff9999;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 12px;
    display: none;
  }
  .err::before { content: '[!] '; color: var(--red); font-weight: 700; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    margin-bottom: 16px;
  }

  .card-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .card-head .title {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .card-head .title::before {
    content: '// ';
    color: var(--red);
    font-weight: 400;
  }

  .card-body { padding: 16px; }

  #loginBox { max-width: 380px; margin: 80px auto; }
  #loginBox .card-body { padding: 24px; }

  #loginBox .prompt {
    color: var(--txt-3);
    font-size: 12px;
    margin-bottom: 14px;
  }

  #loginBox .prompt::before { content: '> '; color: var(--green); }

  input, select {
    background: #0d0d0d;
    border: 1px solid var(--line);
    color: var(--txt);
    padding: 10px 12px;
    border-radius: 0;
    width: 100%;
    outline: none;
    font-family: inherit;
    font-size: 12px;
    transition: border-color 0.15s;
    margin-bottom: 8px;
  }

  input::placeholder { color: var(--txt-3); }

  input:focus, select:focus {
    border-color: var(--red);
    background: #0f0a0a;
  }

  button {
    background: var(--red);
    border: 1px solid var(--red);
    color: #fff;
    padding: 10px 16px;
    border-radius: 0;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  button:hover { background: var(--red-2); border-color: var(--red-2); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  button.ghost {
    background: transparent;
    border: 1px solid var(--line-2);
    color: var(--txt-2);
    font-weight: 500;
    text-transform: none;
    font-size: 11px;
    padding: 6px 10px;
  }

  button.ghost:hover {
    background: var(--panel-2);
    border-color: var(--txt-3);
    color: var(--txt);
  }

  button.ghost.green { border-color: #1e4a2e; color: #4ade80; }
  button.ghost.green:hover { background: #0f1f15; border-color: var(--green); color: #4ade80; }

  button.ghost.yellow { border-color: #4a3d1e; color: #e5c44a; }
  button.ghost.yellow:hover { background: #1f1a0f; border-color: var(--yellow); color: #e5c44a; }

  button.ghost.red { border-color: #4a1e1e; color: #ff6666; }
  button.ghost.red:hover { background: #1f0f0f; border-color: var(--red); color: #ff6666; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 14px 16px;
    position: relative;
  }

  .stat::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--red);
  }

  .stat.green::before { background: var(--green); }
  .stat.yellow::before { background: var(--yellow); }
  .stat.blue::before { background: var(--blue); }

  .stat .n {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    letter-spacing: -1px;
  }

  .stat .l {
    font-size: 10px;
    color: var(--txt-3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 6px;
  }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
  }

  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }

  th {
    color: var(--txt-3);
    font-size: 10px;
    text-transform: uppercase;
    font-weight: 500;
    letter-spacing: 1px;
    background: #0d0d0d;
  }

  tbody tr:hover { background: #141414; }
  tbody tr:last-child td { border-bottom: none; }

  .key-cell {
    font-family: inherit;
    color: #ff8888;
    cursor: pointer;
    padding: 3px 6px;
    border: 1px solid #2a1010;
    background: #150808;
    display: inline-block;
    font-size: 11px;
    transition: all 0.15s;
  }

  .key-cell:hover { background: #200a0a; border-color: var(--red); }

  .badge {
    display: inline-block;
    padding: 3px 8px;
    font-size: 10px;
    font-weight: 500;
    border: 1px solid;
    letter-spacing: 0.5px;
  }

  .badge.ok { color: #4ade80; border-color: #1e4a2e; background: #0a1a10; }
  .badge.bad { color: #ff6666; border-color: #4a1e1e; background: #1a0a0a; }
  .badge.warn { color: #e5c44a; border-color: #4a3d1e; background: #1a150a; }

  .hwid-cell {
    font-size: 10px;
    color: var(--txt-3);
    font-family: inherit;
  }

  .actions {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .actions button {
    padding: 5px 9px;
    font-size: 10px;
    font-weight: 500;
    border-radius: 0;
    text-transform: none;
  }

  .output {
    background: #0a0a0a;
    border: 1px solid var(--line);
    border-left: 3px solid var(--green);
    padding: 12px 14px;
    margin-top: 10px;
    font-family: inherit;
    font-size: 11.5px;
    line-height: 1.8;
    color: #4ade80;
    white-space: pre-wrap;
    max-height: 240px;
    overflow: auto;
    display: none;
  }

  .output::before {
    content: '$ cat keys.txt';
    display: block;
    color: var(--txt-3);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--line-2);
    font-size: 10px;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-left: 3px solid var(--red);
    color: var(--txt);
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 500;
    z-index: 9999;
    opacity: 0;
    transform: translateX(-20px);
    transition: all 0.25s;
    pointer-events: none;
    max-width: 320px;
  }

  .toast.show { opacity: 1; transform: translateX(0); }
  .toast.success { border-left-color: var(--green); }
  .toast.error { border-left-color: var(--red); }
  .toast::before { content: '> '; color: var(--txt-3); }

  .empty {
    text-align: center;
    padding: 32px 16px;
    color: var(--txt-3);
    font-size: 12px;
  }

  .empty::before { content: '// '; color: var(--txt-3); }

  .footer {
    text-align: center;
    color: var(--txt-3);
    font-size: 10px;
    padding: 20px 0 10px;
    letter-spacing: 1px;
  }

  .footer::before { content: '─── '; color: var(--line-2); }
  .footer::after { content: ' ───'; color: var(--line-2); }

  .periodo-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .periodo-tabs .tab {
    background: transparent;
    border: 1px solid var(--line-2);
    color: var(--txt-2);
    padding: 8px 16px;
    font-size: 11px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .periodo-tabs .tab:hover {
    background: var(--panel-2);
    border-color: var(--txt-3);
    color: var(--txt);
  }

  .periodo-tabs .tab.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    font-weight: 700;
  }

  .section-label {
    color: var(--txt-3);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  @media (max-width: 700px) {
    body { padding: 12px 8px; font-size: 12px; }
    .header { padding: 10px 12px; }
    .brand h1 { font-size: 13px; }
    .card-head { padding: 10px 12px; }
    .card-body { padding: 12px; }
    .stat { padding: 10px 12px; }
    .stat .n { font-size: 20px; }
    .stat .l { font-size: 9px; }
    th, td { padding: 7px 6px; font-size: 10.5px; }
    .key-cell { font-size: 10px; padding: 2px 4px; }
    .actions { gap: 3px; }
    .actions button { padding: 4px 7px; font-size: 9px; }
  }

  @media (max-width: 400px) {
    .grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .actions { flex-direction: column; }
    .actions button { width: 100%; }
    .periodo-tabs .tab { flex: 1; padding: 8px 6px; font-size: 10px; }
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0a0a0a; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; }
  ::-webkit-scrollbar-thumb:hover { background: var(--red); }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="brand">
      <div class="dot"></div>
      <h1>QZZ<span>_admin</span></h1>
    </div>
    <div class="meta">status: <b>online</b> • v1.2</div>
  </div>

  <div class="err" id="errBox"></div>

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <div class="card-head">
      <div class="title">auth</div>
    </div>
    <div class="card-body">
      <div class="prompt">insira a senha do administrador</div>
      <input type="password" id="adminPass" placeholder="password..." onkeydown="if(event.key==='Enter') login()">
      <button onclick="login()" style="width:100%">▸ Entrar</button>
    </div>
  </div>

  <!-- PAINEL -->
  <div id="panel" style="display:none">

    <!-- SELETOR DE PERÍODO (filtro) -->
    <div class="card">
      <div class="card-head">
        <div class="title">período</div>
        <span style="color:var(--txt-3);font-size:10px" id="periodoLabel">filtrando: 1 hora</span>
      </div>
      <div class="card-body" style="padding:12px 16px">
        <div class="periodo-tabs">
          <button class="tab active" data-periodo="1h" onclick="setPeriodo(this)">1 hora</button>
          <button class="tab" data-periodo="1d" onclick="setPeriodo(this)">1 dia</button>
          <button class="tab" data-periodo="7d" onclick="setPeriodo(this)">7 dias</button>
          <button class="tab" data-periodo="30d" onclick="setPeriodo(this)">30 dias</button>
          <button class="tab" data-periodo="all" onclick="setPeriodo(this)">tudo</button>
        </div>
      </div>
    </div>

    <div class="stats-grid" id="stats"></div>

    <!-- GERAR KEYS -->
    <div class="card">
      <div class="card-head">
        <div class="title">gerar keys</div>
        <button class="ghost" onclick="refreshAll()">↻ atualizar</button>
      </div>
      <div class="card-body">
        <div style="margin-bottom:12px">
          <div class="section-label">duração</div>
          <div class="periodo-tabs" id="duracaoTabs">
            <button class="tab active" data-dias="0.0416666667" onclick="setDuracao(this)">1 hora</button>
            <button class="tab" data-dias="1" onclick="setDuracao(this)">1 dia</button>
            <button class="tab" data-dias="7" onclick="setDuracao(this)">7 dias</button>
            <button class="tab" data-dias="30" onclick="setDuracao(this)">30 dias</button>
          </div>
        </div>
        <div class="grid">
          <input type="number" id="qty" value="1" placeholder="quantidade" min="1" max="100">
          <input type="text" id="note" placeholder="nota (opcional)">
        </div>
        <button onclick="generate()">▸ Gerar</button>
        <div class="output" id="output"></div>
      </div>
    </div>

    <!-- KEYS -->
    <div class="card">
      <div class="card-head">
        <div class="title">keys</div>
        <button class="ghost" onclick="loadKeys()">↻ atualizar</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Key</th>
              <th>Status</th>
              <th>Expira</th>
              <th>HWID</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="keysTable"></tbody>
        </table>
      </div>
    </div>

    <!-- LOGS -->
    <div class="card">
      <div class="card-head">
        <div class="title">logs</div>
        <button class="ghost" onclick="loadLogs()">↻ atualizar</button>
      </div>
      <div class="table-wrap" style="max-height:380px; overflow-y:auto;">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Key</th>
              <th>Ação</th>
              <th>Detalhe</th>
            </tr>
          </thead>
          <tbody id="logsTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="footer">qzz system</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
let pass = '';
let periodoAtual = '1h';
let duracaoDias = 0.0416666667; // padrão: 1 hora

const PERIODO_LABEL = {
  '1h': '1 hora',
  '1d': '1 dia',
  '7d': '7 dias',
  '30d': '30 dias',
  'all': 'tudo'
};

let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

async function api(path, opts = {}) {
  try {
    const res = await fetch(API + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', 'x-admin-pass': pass, ...(opts.headers||{}) }
    });
    return await res.json();
  } catch (e) {
    showErr('falha na conexão com o servidor');
    throw e;
  }
}

function showErr(msg) {
  const el = document.getElementById('errBox');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function login() {
  pass = document.getElementById('adminPass').value;
  if (!pass) return showToast('digite a senha', 'error');
  api('/api/admin/stats').then(r => {
    if (!r.success) return showToast('senha incorreta', 'error');
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    showToast('autenticado', 'success');
    refreshAll();
  }).catch(() => {});
}

function setPeriodo(btn) {
  document.querySelectorAll('.periodo-tabs .tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  periodoAtual = btn.dataset.periodo;
  document.getElementById('periodoLabel').textContent = 'filtrando: ' + PERIODO_LABEL[periodoAtual];
  refreshAll();
}

function setDuracao(btn) {
  document.querySelectorAll('#duracaoTabs .tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  duracaoDias = parseFloat(btn.dataset.dias);
}

function refreshAll() { loadStats(); loadKeys(); loadLogs(); }

async function loadStats() {
  const r = await api(`/api/admin/stats?periodo=${periodoAtual}`);
  if (!r.success) return;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${r.total}</div><div class="l">total</div></div>
    <div class="stat green"><div class="n">${r.ativas}</div><div class="l">ativas</div></div>
    <div class="stat yellow"><div class="n">${r.expiradas}</div><div class="l">expiradas</div></div>
    <div class="stat blue"><div class="n">${r.usadas}</div><div class="l">ativadas</div></div>
  `;
}

async function generate() {
  const quantity = document.getElementById('qty').value;
  const note = document.getElementById('note').value;
  const r = await api('/api/admin/generate', {
    method:'POST',
    body: JSON.stringify({ days: duracaoDias, quantity, note })
  });
  if (!r.success) return showToast(r.message || 'erro ao gerar', 'error');
  const out = document.getElementById('output');
  out.style.display = 'block';
  out.textContent = r.keys.map(k => k.key).join('\n');
  showToast(`${r.count} key(s) gerada(s)`, 'success');
  if (r.keys.length === 1) navigator.clipboard.writeText(r.keys[0].key);
  refreshAll();
}

async function loadKeys() {
  const r = await api('/api/admin/keys');
  if (!r.success) return;
  const tbody = document.getElementById('keysTable');
  if (!r.keys.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">nenhuma key cadastrada</td></tr>`;
    return;
  }
  tbody.innerHTML = r.keys.map(k => {
    const exp = k.expires_at ? new Date(k.expires_at).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit' }) : '—';
    const expired = k.expires_at && Date.now() > k.expires_at;
    let status;
    if (!k.active) status = '<span class="badge warn">pausada</span>';
    else if (expired) status = '<span class="badge bad">expirada</span>';
    else if (k.expires_at === 0) status = '<span class="badge warn">aguardando</span>';
    else status = '<span class="badge ok">ativa</span>';
    const pauseBtn = k.active
      ? `<button class="ghost yellow" onclick="toggle('${k.key}')">pausar</button>`
      : `<button class="ghost green" onclick="toggle('${k.key}')">reativar</button>`;
    return `<tr>
      <td><span class="key-cell" onclick="copy('${k.key}')">${k.key}</span></td>
      <td>${status}</td>
      <td style="color:var(--txt-2);font-size:10.5px">${exp}</td>
      <td class="hwid-cell">${k.hwid ? k.hwid.slice(0,10)+'…' : '—'}</td>
      <td>
        <div class="actions">
          ${pauseBtn}
          <button class="ghost" onclick="resetHwid('${k.key}')">reset</button>
          <button class="ghost red" onclick="del('${k.key}')">del</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function loadLogs() {
  const r = await api(`/api/admin/logs?periodo=${periodoAtual}`);
  if (!r.success) return;
  const tbody = document.getElementById('logsTable');
  if (!r.logs.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty">nenhuma atividade no período</td></tr>`;
    return;
  }
  tbody.innerHTML = r.logs.map(l => `
    <tr>
      <td style="color:var(--txt-3);font-size:10px">${new Date(l.created_at).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })}</td>
      <td><span class="key-cell" style="font-size:10px">${l.key||'—'}</span></td>
      <td style="font-size:10.5px">${l.action}</td>
      <td style="color:var(--txt-3);font-size:10px">${l.detail||''}</td>
    </tr>
  `).join('');
}

async function toggle(key) {
  const r = await api('/api/admin/toggle', { method:'POST', body: JSON.stringify({ key }) });
  if (r.success) showToast(r.active ? 'key reativada' : 'key pausada', 'success');
  loadKeys(); loadStats();
}

async function resetHwid(key) {
  if (!confirm('resetar hwid desta key?')) return;
  const r = await api('/api/admin/reset-hwid', { method:'POST', body: JSON.stringify({ key }) });
  if (r.success) showToast('hwid resetado', 'success');
  loadKeys();
}

async function del(key) {
  if (!confirm('deletar esta key permanentemente?')) return;
  const r = await api('/api/admin/delete', { method:'POST', body: JSON.stringify({ key }) });
  if (r.success) showToast('key deletada', 'success');
  loadKeys(); loadStats();
}

function copy(t) {
  navigator.clipboard.writeText(t);
  showToast('copiado', 'success');
}
</script>
</body>
</html>
